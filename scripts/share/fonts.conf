<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Only the bundled Orbitron, for scripts/gen-share-images.mjs (the same text on every machine). -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir prefix="xdg">mop-share-fontconfig</cachedir>
  <!-- Orbitron has no italic: slant it, as browsers do for the site's <i> (from fontconfig's 90-synthetic.conf). -->
  <match target="font">
    <test name="slant" compare="eq"><const>roman</const></test>
    <test target="pattern" name="slant" compare="not_eq"><const>roman</const></test>
    <edit name="matrix" mode="assign">
      <times><name>matrix</name><matrix><double>1</double><double>0.2</double><double>0</double><double>1</double></matrix></times>
    </edit>
    <edit name="slant" mode="assign"><const>oblique</const></edit>
  </match>
</fontconfig>
